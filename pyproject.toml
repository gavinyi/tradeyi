[project]
name = "futu-paper-quant"
version = "0.1.0"
description = "US stock paper-trading system backed by Futu OpenAPI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "futu-api>=9.4.5608",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "streamlit>=1.40",
  "exchange-calendars>=4.7",
  "pyarrow>=18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
futu_quant = ["config_center/_specs_data.json"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
postgres = ["psycopg[binary]>=3.2"]
marketdata = ["yfinance>=0.2.65"]
research = ["pyqlib>=0.9.7"]
ml = [
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "data", "scripts", ".venv", ".uv-cache"]
# 临时目录固定到 E 盘：C 盘余量紧张，默认 tmp 满了会让测试伪装成大批假红
# （2026-10-27 事故：C 盘仅剩 29GB，跑出 22 条假失败，误导排查）。
addopts = ["--basetemp=data/qa/_pytest_tmp"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", ".uv-cache"]
